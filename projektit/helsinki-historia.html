<!doctype html>
<html lang="fi">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Helsingin historialliset kartat</title>
<link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css">
<style>
  :root {
    --bg: #f6f2ea;
    --panel: #fffdf8;
    --ink: #2b2620;
    --muted: #7a6f60;
    --accent: #8a3b2a;
    --line: #e2d9c8;
  }
  * { box-sizing: border-box; }
  html, body { height: 100%; margin: 0; }
  body {
    font-family: Georgia, "Times New Roman", serif;
    color: var(--ink);
    background: var(--bg);
    display: grid;
    grid-template-columns: 360px 1fr;
  }
  #sivu {
    background: var(--panel);
    border-right: 1px solid var(--line);
    overflow-y: auto;
    padding: 20px;
  }
  #sivu a.takaisin { font: 14px system-ui, sans-serif; color: var(--muted); text-decoration: none; }
  #sivu h1 { font-size: 1.5rem; margin: 12px 0 4px; }
  #sivu .ingressi { font: 14px/1.5 system-ui, sans-serif; color: var(--muted); margin: 0 0 16px; }

  .kortti {
    border: 1px solid var(--line);
    border-radius: 8px;
    padding: 12px 14px;
    margin-bottom: 10px;
    cursor: pointer;
    background: #fff;
    transition: border-color .15s, box-shadow .15s;
  }
  .kortti:hover { border-color: var(--accent); }
  .kortti.aktiivinen { border-color: var(--accent); box-shadow: 0 0 0 2px rgba(138,59,42,.15); }
  .kortti .vuosi { font: 600 12px system-ui, sans-serif; color: var(--accent); letter-spacing: .04em; }
  .kortti h2 { font-size: 1.05rem; margin: 2px 0 4px; }
  .kortti p { font: 13px/1.45 system-ui, sans-serif; color: var(--muted); margin: 0; }

  #tarina { margin-top: 18px; border-top: 2px solid var(--accent); padding-top: 14px; }
  #tarina[hidden] { display: none; }
  #tarina h2 { margin: 0 0 8px; font-size: 1.25rem; }
  #tarina p { line-height: 1.6; margin: 0 0 12px; }
  #tarina .lahde { font: 12px/1.5 system-ui, sans-serif; color: var(--muted); }
  #tarina .lahde a { color: var(--accent); }
  .saadin { font: 13px system-ui, sans-serif; margin: 12px 0; display: flex; gap: 10px; align-items: center; }
  .saadin input { flex: 1; accent-color: var(--accent); }
  button.sulje {
    font: 13px system-ui, sans-serif; background: none; border: 1px solid var(--line);
    border-radius: 6px; padding: 5px 10px; cursor: pointer; color: var(--muted);
  }

  #kartta { height: 100%; }

  @media (max-width: 800px) {
    body { grid-template-columns: 1fr; grid-template-rows: 55vh 45vh; }
    #kartta { order: 1; }
    #sivu { order: 2; border-right: 0; border-top: 1px solid var(--line); }
  }
</style>
</head>
<body>

<aside id="sivu">
  <a class="takaisin" href="../index.html">← Takaisin etusivulle</a>
  <h1>Kaupungin historialliset kartat</h1>
  <p class="ingressi">Valitse kartta ja lue sen tarina. Liukusäätimellä näet, miten kaupunki on muuttunut.</p>
  <div id="lista"></div>

  <section id="tarina" hidden>
    <h2 id="t-otsikko"></h2>
    <div class="saadin">
      <label for="lapinakyvyys">Läpinäkyvyys</label>
      <input id="lapinakyvyys" type="range" min="0" max="1" step="0.05" value="0.85">
    </div>
    <div id="t-teksti"></div>
    <p class="lahde" id="t-lahde"></p>
    <button class="sulje" id="sulje">Piilota kartta</button>
  </section>
</aside>

<div id="kartta"></div>

<script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
<script>
  // --- Taustakartta ---
  const kartta = L.map('kartta').setView([60.17, 24.94], 12);
  L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', {
    maxZoom: 19,
    attribution: '© OpenStreetMap-tekijät'
  }).addTo(kartta);

  let kartat = [];
  let aktiivinenId = null;
  let aktiivinenTaso = null;

  const $ = id => document.getElementById(id);

  // --- Aineiston lataus (data/kartat.json) ---
  fetch('data/kartat.json')
    .then(r => r.json())
    .then(data => {
      kartat = data.kartat.sort((a, b) => a.vuosi - b.vuosi);
      piirraLista();
      const id = location.hash.slice(1);
      if (id) valitse(id);
    })
    .catch(() => {
      $('lista').textContent = 'Karttalistaa ei voitu ladata. Avaa sivu palvelimen kautta (GitHub Pages tai paikallinen palvelin).';
    });

  function piirraLista() {
    $('lista').innerHTML = '';
    kartat.forEach(k => {
      const el = document.createElement('div');
      el.className = 'kortti';
      el.dataset.id = k.id;
      el.innerHTML = '<div class="vuosi"></div><h2></h2><p></p>';
      el.querySelector('.vuosi').textContent = k.vuosi;
      el.querySelector('h2').textContent = k.otsikko;
      el.querySelector('p').textContent = k.lyhyt || '';
      el.addEventListener('click', () => valitse(k.id));
      $('lista').appendChild(el);
    });
  }

  // --- Kartan valinta ---
  function valitse(id) {
    const k = kartat.find(x => x.id === id);
    if (!k) return;
    poistaTaso();

    const rajat = L.latLngBounds(k.rajat); // [[etelä, länsi], [pohjoinen, itä]]
    aktiivinenTaso = L.tileLayer(`kartat/${k.id}/{z}/{x}/{y}.${k.tyyppi || 'jpg'}`, {
      minZoom: k.minZoom || 10,
      maxZoom: 21,
      maxNativeZoom: k.maxZoom || 17,
      bounds: rajat,
      opacity: parseFloat($('lapinakyvyys').value),
      attribution: k.lahde ? k.lahde.nimi : ''
    }).addTo(kartta);

    kartta.fitBounds(rajat);
    aktiivinenId = id;
    location.hash = id;

    document.querySelectorAll('.kortti').forEach(e =>
      e.classList.toggle('aktiivinen', e.dataset.id === id));

    $('t-otsikko').textContent = k.otsikko;
    $('t-teksti').innerHTML = (k.tarina || []).map(p => `<p>${p}</p>`).join('');
    $('t-lahde').innerHTML = k.lahde
      ? 'Lähde: ' + (k.lahde.url ? `<a href="${k.lahde.url}" target="_blank" rel="noopener">${k.lahde.nimi}</a>` : k.lahde.nimi)
      : '';
    $('tarina').hidden = false;
  }

  function poistaTaso() {
    if (aktiivinenTaso) { kartta.removeLayer(aktiivinenTaso); aktiivinenTaso = null; }
  }

  $('lapinakyvyys').addEventListener('input', e => {
    if (aktiivinenTaso) aktiivinenTaso.setOpacity(parseFloat(e.target.value));
  });

  $('sulje').addEventListener('click', () => {
    poistaTaso();
    aktiivinenId = null;
    history.replaceState(null, '', location.pathname);
    $('tarina').hidden = true;
    document.querySelectorAll('.kortti').forEach(e => e.classList.remove('aktiivinen'));
  });
</script>
</body>
</html>
